setConf jobName LPAJOB
setConf smallLayout 1
###############################################################################
##
##  Copy from here to COPY_END, for every VALE framework LPA Component Module
##  Modify the two variables below for each Component Module Name and Version
##
###############################################################################
set compModName "RowTermination"
set compModVers "V05"

###############################################################################
set compModMap "${compModName}_$compModVers.lpa_map" 
set compModRunset "${compModName}_$compModVers.xml"

## Search for the layer map in the CM, CM2, and local directories 
if {[info exists env(CDS_MVS_IMF_CM)]} {
   ## Variable for the CM directory is defined
   set compModDir $env(CDS_MVS_IMF_CM)
   if {[file isdirectory $compModDir]} {
      ## The variable contains a valid CM directory
      if {[file exists $compModDir/Include/$compModMap]} {
         ## Layer map file exists in the CM directory
         set compModMapPath "$compModDir/Include/$compModMap"
         set compModRunsetPath "$compModDir/Include/$compModRunset"
      } else {
         ## No layer map in the CM directory
         if {[info exists env(CDS_MVS_IMF_CM2)]} {
            ## Variable for the CM2 directory is defined
            set compModDir $env(CDS_MVS_IMF_CM2)
            if {[file isdirectory $compModDir]} {
               ## The variable contains a valid CM2 directory
               if {[file exists $compModDir/Include/$compModMap]} {
                  ## Layer map file exists in the CM2 directory
                  set compModMapPath "$compModDir/Include/$compModMap"
                  set compModRunsetPath "$compModDir/Include/$compModRunset"
               } else {
                  ## No layer map in the CM2 directory either, set to local dir
                  set compModDir "./"
                  if {[file exists $compModDir/Include/$compModMap]} {
                     ## Layer map found in the local dir
                     set compModMapPath "$compModDir/Include/$compModMap"
                     set compModRunsetPath "$compModDir/Include/$compModRunset"
                  } else {
                     ## No layer map found
                     puts "VALE ERROR: Failed to set the Component Module paths."
                  }
               }
            } else {
               ## No valid CM2 directory
               set compModDir "./"
               if {[file exists $compModDir/Include/$compModMap]} {
                  ## Layer map found in the local dir
                  set compModMapPath "$compModDir/Include/$compModMap"
                  set compModRunsetPath "$compModDir/Include/$compModRunset"
               } else {
                  ## No layer map found
                  puts "VALE ERROR: Failed to set the Component Module paths."
               }
            }
         } else {
            ## No CM2 variable defined 
            set compModDir "./"
            if {[file exists $compModDir/Include/$compModMap]} {
               ## Layer map found in the local dir
               set compModMapPath "$compModDir/Include/$compModMap"
               set compModRunsetPath "$compModDir/Include/$compModRunset"
            } else {
               ## No layer map found
               puts "VALE ERROR: Failed to set the Component Module paths."
            }
         }
      }
   } else {
      ## No valid CM directory 
      if {[info exists env(CDS_MVS_IMF_CM2)]} {
         ## Variable for the CM2 directory is defined
         set compModDir $env(CDS_MVS_IMF_CM2)
         if {[file isdirectory $compModDir]} {
            ## The variable contains a valid CM2 directory
            if {[file exists $compModDir/Include/$compModMap]} {
               ## Layer map file exists in the CM2 directory
               set compModMapPath "$compModDir/Include/$compModMap"
               set compModRunsetPath "$compModDir/Include/$compModRunset"
            } else {
               ## No layer map in the CM2 directory either, set to local dir
               set compModDir "./"
               if {[file exists $compModDir/Include/$compModMap]} {
                  ## Layer map found in the local dir
                  set compModMapPath "$compModDir/Include/$compModMap"
                  set compModRunsetPath "$compModDir/Include/$compModRunset"
               } else {
                  ## No layer map found
                  puts "VALE ERROR: Failed to set the Component Module paths."
               }
            }
         } else {
            ## No valid CM2 directory
            set compModDir "./"
            if {[file exists $compModDir/Include/$compModMap]} {
               ## Layer map found in the local dir
               set compModMapPath "$compModDir/Include/$compModMap"
               set compModRunsetPath "$compModDir/Include/$compModRunset"
            } else {
               ## No layer map found
               puts "VALE ERROR: Failed to set the Component Module paths."
            }
         }
      } else {
         ## No CM2 variable defined 
         set compModDir "./"
         if {[file exists $compModDir/Include/$compModMap]} {
            ## Layer map found in the local dir
            set compModMapPath "$compModDir/Include/$compModMap"
            set compModRunsetPath "$compModDir/Include/$compModRunset"
         } else {
            ## No layer map found
            puts "VALE ERROR: Failed to set the Component Module paths."
         }
      }
   }
} else {
   if {[info exists env(CDS_MVS_IMF_CM2)]} {
      ## Variable for the CM2 directory defined
      set compModDir $env(CDS_MVS_IMF_CM2)
      if {[file isdirectory $compModDir]} {
         ## The variable contains a valid CM2 directory
         if {[file exists $compModDir/Include/$compModMap]} {
            ## Layer map file exists in the CM2 directory
            set compModMapPath "$compModDir/Include/$compModMap"
            set compModRunsetPath "$compModDir/Include/$compModRunset"
         } else {
            ## No layer map in the CM2 directory either, set to local dir
            set compModDir "./"
            if {[file exists $compModDir/Include/$compModMap]} {
               ## Layer map found in the local dir
               set compModMapPath "$compModDir/Include/$compModMap"
               set compModRunsetPath "$compModDir/Include/$compModRunset"
            } else {
               ## No layer map found
               puts "VALE ERROR: Failed to set the Component Module paths."
            }
         }
      } else {
         ## No valid CM2 directory
         set compModDir "./"
         if {[file exists $compModDir/Include/$compModMap]} {
            ## Layer map found in the local dir
            set compModMapPath "$compModDir/Include/$compModMap"
            set compModRunsetPath "$compModDir/Include/$compModRunset"
         } else {
            ## No layer map found
            puts "VALE ERROR: Failed to set the Component Module paths."
         }
      }
   } else {
      ## No CM2 variable defined 
      set compModDir "./"
      if {[file exists $compModDir/Include/$compModMap]} {
         ## Layer map found in the local dir
         set compModMapPath "$compModDir/Include/$compModMap"
         set compModRunsetPath "$compModDir/Include/$compModRunset"
      } else {
         ## No layer map found
         puts "VALE ERROR: Failed to set the Component Module paths."
      }
   }
}
###############################################################################
##
##  COPY_END 
##
###############################################################################
           
setConf layerMapFile "$compModMapPath"
set patternTechFile "$env(DFMHOME)/share/lpa/techfiles/patternMatch/TechFile/lpa.tcl"

## Set layer names per Component Module
Poly {
  setConf LPATechFile $patternTechFile
}
PolyTrack {
  setConf LPATechFile $patternTechFile
}
LiAct {
  setConf LPATechFile $patternTechFile
}

setConf patInputReplace "$compModRunsetPath"
setConf dmcErrorLimit 90000
setConf layerOrder { Poly PolyTrack LiAct }
setConf guidelineType router

