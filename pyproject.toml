[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spice-model-benchmark"
version = "1.0.0"
description = "A comprehensive benchmarking system for SPICE models with focus on MOSFET verification"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [
    {name = "SPICE Model Benchmark Team"},
]
maintainers = [
    {name = "SPICE Model Benchmark Team"},
]
keywords = ["spice", "mosfet", "semiconductor", "benchmark", "verification", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "matplotlib>=3.4.0,<4.0.0",
    "pandas>=1.3.0,<2.0.0",
    "scipy>=1.7.0,<2.0.0",
    "tqdm>=4.62.0,<5.0.0",
    "colorama>=0.4.4,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/spice_model_benchmark"
Documentation = "https://github.com/yourusername/spice_model_benchmark#readme"
Repository = "https://github.com/yourusername/spice_model_benchmark.git"
Issues = "https://github.com/yourusername/spice_model_benchmark/issues"
Changelog = "https://github.com/yourusername/spice_model_benchmark/blob/main/CHANGELOG.md"

[project.scripts]
spice-benchmark = "spice_model_benchmark.cli:main"
spice_model_benchmark = "spice_model_benchmark.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["spice_model_benchmark*"]

[tool.setuptools.package-data]
spice_model_benchmark = ["*.txt", "*.md"]

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["B011"]  # assert false

[tool.ruff.isort]
known-first-party = ["spice_model_benchmark"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "pandas.*",
    "scipy.*",
    "tqdm.*",
    "colorama.*",
]
ignore_missing_imports = true
